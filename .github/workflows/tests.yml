name: Test InkyPi
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    strategy:
      matrix:
        python: ['3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -c install/requirements-dev.txt pytest requests urllib3 pillow psutil python-dotenv jinja2 numpy pytz flask
      - name: Run tests with the mock display
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Render the reference clock
        run: python scripts/render_reference_clock.py
      - name: Verify pixel parity and benchmark both renderers
        if: matrix.python == '3.12'
        run: |
          git worktree add --detach "$RUNNER_TEMP/inkypi-baseline" 1a13835fdd4d8ab200bbaf6707d488219df751b3
          python scripts/benchmark_display.py --baseline "$RUNNER_TEMP/inkypi-baseline" --renderers > "$RUNNER_TEMP/display-benchmark.json"
          cat "$RUNNER_TEMP/display-benchmark.json"
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: display-benchmark
          path: ${{ runner.temp }}/display-benchmark.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: reference-clock-800x480
          path: mock_display_output/reference-clock.png
          if-no-files-found: error
